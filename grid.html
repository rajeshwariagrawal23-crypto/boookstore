    <style>
        .heading {
            border: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 4fr;
            background-color: burlywood;
        }
        
        .subheading {
            border: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            background-color: rgb(236, 198, 162);
        }
        
        .branch {
            border: 1px solid black;
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            background-color: rgb(245, 236, 228);
            grid-column: 1;
        }
        
        .heading>div,
        .subheading>div {
            border: 1px solid black;
            padding: 8px;
        }
        
        .website {
            text-align: center;
        }
        
        .logo img {
            display: block;
            width: 100%;
            max-width: 120px;
            height: auto;
            margin: 0 auto;
        }
        
        .description {
            grid-column: 2 / -1;
            display: grid;
            place-items: center;
            background-color: aliceblue;
        }
    </style>
