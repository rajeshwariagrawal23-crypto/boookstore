<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL BAJAJ INSTITUTE OF TECHNOLOGY AND MANAGEMENT</title>
    <style>
        .heading {
            border: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 4fr;
            background-color: burlywood;
        }
        
        .subheading {
            border: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            background-color: rgb(236, 198, 162);
        }
        
        .heading>div,
        .subheading>div,
        .branch>div {
            border: 1px solid black;
            padding: 8px;
        }
        
        .website {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>GL BAJAJ INSTITUTE OF TECHNOLOGY</h1>
    <div>
        <div class="heading">
            <div class="logo">Logo </div>
            <div class="website">Website Name</div>
        </div>
        <div class="subheading">
            <div>Name</div>
            <div>Login</div>
            <div>Registration</div>
            <div>Catalouge</div>
            <div>Cart</div>
        </div class="branch">
        <div>CSE</div>
        <div>ECE</div>
        <div>EEE</div>
        <div>CIVIL</div>
        <div style="display: grid;">
            <a href="https://www.glbitm.org/"></a>Description For Website</div>
    </div>
</body>

</html>
